<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>全卷数据分析 · 多维细目表</title>
  <style>
    :root{color-scheme:light;--ink:#1d1d1f;--muted:#687586;--line:#dfe5ec;--silver:#f5f5f7;--blue:#1f67a5;--blue-soft:#e8f1fa;--teal:#287e82;--gold:#a77532;--gold-soft:#f5ecdc;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--silver);color:var(--ink)}button{font:inherit;color:inherit}button:focus-visible{outline:3px solid #66a5dc;outline-offset:3px}.dashboard{height:100%;display:grid;grid-template-rows:76px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:#fff;border-bottom:1px solid var(--line)}.title{display:flex;align-items:baseline;gap:18px}.title h1{margin:0;font-size:28px;letter-spacing:-.04em;font-weight:650}.title span{color:var(--muted);font-size:14px}.close{width:42px;height:42px;border:0;border-radius:50%;background:var(--silver);font-size:25px;cursor:pointer}main{min-height:0;padding:18px 22px 22px;display:grid;grid-template-rows:124px 1fr;gap:14px}.blueprint{display:grid;grid-template-columns:176px repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.blueprint>div{padding:13px 15px;border-left:1px solid var(--line);min-width:0}.blueprint>div:first-child{border-left:0;background:var(--blue-soft)}.blueprint small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.blueprint b,.blueprint span{display:block;font-size:14px;line-height:1.35}.blueprint .source b{font-size:20px;color:var(--blue)}.blueprint .source span{color:var(--muted);font-size:12px;margin-top:6px}.grid{min-height:0;display:grid;grid-template-columns:1.12fr .88fr;gap:14px}.panel{min-height:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px;overflow:hidden}.panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.panel-head h2{margin:0;font-size:20px;letter-spacing:-.03em}.panel-head span{color:var(--muted);font-size:12px}.literacy{display:grid;grid-template-rows:auto 1fr auto}.literacy-grid{min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{position:relative;min-height:0;border:1px solid var(--line);border-radius:16px;padding:17px 18px;background:#fbfcfd;text-align:left;cursor:pointer;overflow:hidden}.metric::after{content:"↗";position:absolute;right:15px;bottom:12px;color:#9aa8b6;font-size:18px}.metric .name{display:block;color:var(--muted);font-size:13px}.metric .number{display:flex;align-items:baseline;gap:7px;margin-top:12px}.metric .number b{font-size:43px;line-height:1;font-weight:550;letter-spacing:-.06em;color:var(--accent)}.metric .number span{font-size:14px;color:var(--muted)}.metric p{margin:10px 0 0;color:#526171;font-size:12px}.literacy-note{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 15px;border-radius:13px;background:var(--blue-soft);color:#395a79;font-size:13px}.literacy-note strong{font-size:15px}.right{min-height:0;display:grid;grid-template-rows:1.03fr .97fr;gap:14px}.module-body{display:grid;grid-template-columns:190px 1fr;align-items:center;height:calc(100% - 40px);gap:14px}.donut{width:164px;height:164px;margin:auto;border-radius:50%;background:conic-gradient(var(--teal) 0 45%,#5d8eca 45% 90%,#d5a34d 90% 100%);display:grid;place-items:center}.donut::before{content:"45 / 45 / 10";width:105px;height:105px;display:grid;place-items:center;border-radius:50%;background:#fff;font-size:15px;font-weight:650;color:#405268}.module-list{display:grid;gap:8px}.module-list button,.difficulty-list button{border:1px solid var(--line);border-radius:12px;background:#fbfcfd;padding:11px 13px;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;cursor:pointer}.module-list button span,.difficulty-list button span{font-size:13px}.module-list button b,.difficulty-list button b{color:var(--accent);font-size:15px}.difficulty-summary{display:grid;grid-template-columns:138px 1fr;gap:16px;min-height:0}.score{border-radius:16px;background:var(--gold-soft);display:flex;flex-direction:column;justify-content:center;padding:18px}.score small{color:#84663f;font-size:11px}.score strong{font-size:41px;color:var(--gold);font-weight:550;letter-spacing:-.05em;margin:8px 0}.score span{font-size:12px;color:#7b6c59}.difficulty-list{display:grid;gap:7px}.difficulty-list button{grid-template-columns:62px 1fr auto;gap:10px;padding:9px 11px}.track{height:7px;border-radius:6px;background:#edf0f4;overflow:hidden}.track i{display:block;height:100%;width:var(--width);background:var(--accent)}.detail{position:fixed;inset:0;display:none;place-items:center;background:rgba(232,237,243,.82);backdrop-filter:blur(18px);padding:38px}.detail.open{display:grid}.detail-card{width:min(1040px,92vw);max-height:86vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 28px 80px rgba(43,61,81,.16)}.detail-card header{display:grid;grid-template-columns:1fr auto;align-items:start;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}.detail-card small{color:var(--muted)}.detail-card h2{font-size:36px;letter-spacing:-.05em;margin:8px 0 0}.detail-value{color:var(--blue);font-size:34px;font-weight:600}.detail-card>p{color:#4d5e70;line-height:1.7}.evidence{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}.evidence article{padding:15px;border-radius:14px;background:#f7f9fb;border:1px solid #e6ebf0}.evidence b{display:block;color:#315f89;font-size:12px;margin-bottom:7px}.evidence span{font-size:14px;line-height:1.5}.source-line{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}@media(max-width:1200px){.blueprint>div:nth-last-child(-n+2){display:none}.blueprint{grid-template-columns:160px repeat(4,1fr)}}
    .detail-close{width:42px;height:42px;border:0;border-radius:50%;background:var(--silver);font-size:25px;cursor:pointer}
  </style>
</head>
<body>
  <div class="dashboard">
    <header class="topbar"><div class="title"><h1>全卷数据分析</h1><span>数据来源：《多维细目表》· 设计预估</span></div><button class="close" id="close-dashboard" aria-label="关闭全卷数据分析">×</button></header>
    <main>
      <section class="blueprint" aria-label="第1题细目表样例">
        <div class="source"><small>多维细目表</small><b>第1题样例</b><span>全卷16题 · 100分 · 60分钟</span></div><div><small>题型／分值</small><b>单选题／3分</b></div><div><small>情境载体</small><span>智慧温室排风扇控制</span></div><div><small>考查知识点</small><span>基于数据分析设计算法；and/or复合逻辑推演</span></div><div><small>核心素养</small><span>计算思维、数字化学习与创新</span></div><div><small>认知／能力</small><span>应用／推演</span></div><div><small>难度／预估得分率</small><b>★★★／0.70</b></div>
      </section>
      <div class="grid">
        <section class="panel literacy"><div class="panel-head"><h2>核心素养覆盖</h2><span>覆盖题数／出现次数</span></div><div class="literacy-grid">
          <button class="metric" data-key="core-info" style="--accent:#287e82"><span class="name">信息意识</span><span class="number"><b>6</b><span>题 · 7处</span></span><p>信息搜索、判断、交流与风险识别</p></button>
          <button class="metric" data-key="core-compute" style="--accent:#1f67a5"><span class="name">计算思维</span><span class="number"><b>16</b><span>题 · 18处</span></span><p>分析、推演、设计与系统建模</p></button>
          <button class="metric" data-key="core-innovation" style="--accent:#6b68ad"><span class="name">数字化学习与创新</span><span class="number"><b>7</b><span>题 · 8处</span></span><p>工具运用、协同创作与问题改进</p></button>
          <button class="metric" data-key="core-responsibility" style="--accent:#a55259"><span class="name">信息社会责任</span><span class="number"><b>8</b><span>题 · 9处</span></span><p>安全、伦理、自主可控与公共责任</p></button>
        </div><div class="literacy-note"><span>同一道题可以同时体现多个素养维度</span><strong>四维全部覆盖</strong></div></section>
        <div class="right">
          <section class="panel module"><div class="panel-head"><h2>课标模块覆盖</h2><span>按分值统计</span></div><div class="module-body"><div class="donut" aria-label="模块分值45、45、10"></div><div class="module-list"><button data-key="module-internet" style="--accent:#287e82"><span>互联网应用与创新</span><b>45分</b></button><button data-key="module-iot" style="--accent:#5d8eca"><span>物联网实践与探索</span><b>45分</b></button><button data-key="module-ai" style="--accent:#a77532"><span>人工智能与智慧社会</span><b>10分</b></button></div></div></section>
          <section class="panel difficulty"><div class="panel-head"><h2>难度结构</h2><span>题量／分值</span></div><div class="difficulty-summary"><div class="score"><small>全卷预估得分率</small><strong>≈0.70</strong><span>尚未经过学生实测</span></div><div class="difficulty-list"><button data-key="difficulty-basic" style="--accent:#287e82"><span>★★</span><span class="track"><i style="--width:51%"></i></span><b>6题 · 25分</b></button><button data-key="difficulty-medium" style="--accent:#a77532"><span>★★★</span><span class="track"><i style="--width:100%"></i></span><b>11题 · 49分</b></button><button data-key="difficulty-advanced" style="--accent:#a55259"><span>★★★★</span><span class="track"><i style="--width:53%"></i></span><b>7题 · 26分</b></button></div></div></section>
        </div>
      </div>
    </main>
  </div>
  <section class="detail" id="detail" aria-hidden="true"><div class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-title"><header><div><small id="detail-kicker"></small><h2 id="detail-title"></h2></div><div class="detail-value" id="detail-value"></div><button class="detail-close" id="detail-close" aria-label="关闭指标详情">×</button></header><p id="detail-copy"></p><div class="evidence" id="detail-evidence"></div><div class="source-line">依据：《多维细目表》逐题记录及第2页汇总。数据属于命题设计预估，不是学生实测结果。</div></div></section>
  <script>
    const details={
      'core-info':{kicker:'核心素养',title:'信息意识',value:'6题 · 7处',copy:'在信息获取、辨析、数据理解和网络风险判断中留下评价证据。',evidence:[['第2题','文件下载数据包接收'],['第7题','大模型历史报告与AIGC幻觉辨伪'],['第9题','百草园智慧农场MQTT'],['第11题','物理实验数据可视化'],['第12题','DNS欺骗重定向'],['第15题','深中通道网络任务']]},
      'core-compute':{kicker:'核心素养',title:'计算思维',value:'16题 · 18处',copy:'覆盖识别、解释、推演、论证和设计，是全卷最主要的认知加工维度。',evidence:[['第1题','智慧温室复合逻辑推演'],['第3题','无人机物流最短路径'],['第6题','管理员密码逆向解密'],['第10题','路由表与下一跳'],['第15题','深中通道网络排障'],['第16题','大沙河物联网系统']]},
      'core-innovation':{kicker:'核心素养',title:'数字化学习与创新',value:'7题 · 8处',copy:'通过工具选择、协同制作、传感器优化和物联网编程体现。',evidence:[['第1题','智慧温室数据与API融合'],['第8题','楼梯灯光敏优化'],['第13题','MQTT气象站通信'],['第14题','跨学科网页协同制作'],['第15题','HTML网页排错'],['第16题','MQTT通信代码补全']]},
      'core-responsibility':{kicker:'核心素养',title:'信息社会责任',value:'8题 · 9处',copy:'从个人信息保护延伸到网络伦理、国家安全、生态数据安全和自主可控。',evidence:[['第4题','东数西算与龙芯自主'],['第5题','智慧校园门禁活体检测'],['第6题','密码加密与安全'],['第7题','AIGC伦理与核验'],['第12题','DNS欺骗风险'],['第16题','DDoS防护与自主可控']]},
      'module-internet':{kicker:'课标模块',title:'互联网应用与创新',value:'45分 · 45%',copy:'以网络传输、路由、DNS、协议选择、网页制作与协同为主要内容。',evidence:[['第2题','TCP数据包重传'],['第3题','网络层IP寻址与最短路径'],['第10题','外网网站访问路由'],['第12题','DNS欺骗'],['第14题','Markdown协同制作'],['第15题','深中通道综合任务']]},
      'module-iot':{kicker:'课标模块',title:'物联网实践与探索',value:'45分 · 45%',copy:'以传感器、数据采集、反馈控制、MQTT、数据可视化和系统安全为主要内容。',evidence:[['第1题','智慧温室排风扇控制'],['第5题','智慧校园门禁'],['第8题','楼梯灯环境感知'],['第9题','智慧农场MQTT'],['第13题','MQTT气象站'],['第16题','大沙河综合任务']]},
      'module-ai':{kicker:'课标模块',title:'人工智能与智慧社会',value:'10分 · 10%',copy:'聚焦人工智能伦理、安全挑战、信息社会责任和关键技术自主可控。',evidence:[['第4题','国产芯片与自主操作系统'],['第7题','生成式AI幻觉辨伪'],['第16(5)题','自主可控与生态数据安全']]},
      'difficulty-basic':{kicker:'难度结构',title:'★★ 低难度',value:'6题 · 25分',copy:'依据PDF汇总口径，难度星数越多表示难度越大。',evidence:[['主要加工','知道、理解与基础辨析'],['评价作用','保证基础知识和基本概念的覆盖'],['数据口径','第2页难度结构汇总']]},
      'difficulty-medium':{kicker:'难度结构',title:'★★★ 中等难度',value:'11题 · 49分',copy:'全卷的主体梯度，以真实情境中的理解、辨析、应用和推演为主。',evidence:[['主要加工','理解、应用、辨析与推演'],['评价作用','支撑大部分学生展示真实问题解决能力'],['数据口径','第2页难度结构汇总']]},
      'difficulty-advanced':{kicker:'难度结构',title:'★★★★ 较高难度',value:'7题 · 26分',copy:'强调分析、设计、论证和复杂条件下的综合迁移。',evidence:[['主要加工','分析、设计、论证与综合迁移'],['评价作用','形成区分度并观察高阶思维'],['数据口径','第2页难度结构汇总']]}
    };
    const detail=document.querySelector('#detail');
    function openDetail(key){const data=details[key];document.querySelector('#detail-kicker').textContent=data.kicker;document.querySelector('#detail-title').textContent=data.title;document.querySelector('#detail-value').textContent=data.value;document.querySelector('#detail-copy').textContent=data.copy;document.querySelector('#detail-evidence').innerHTML=data.evidence.map(item=>`<article><b>${item[0]}</b><span>${item[1]}</span></article>`).join('');detail.classList.add('open');detail.setAttribute('aria-hidden','false')}
    function closeDetail(){detail.classList.remove('open');detail.setAttribute('aria-hidden','true')}
    document.querySelectorAll('[data-key]').forEach(button=>button.addEventListener('click',()=>openDetail(button.dataset.key)));document.querySelector('#detail-close').addEventListener('click',closeDetail);detail.addEventListener('click',event=>{if(event.target===detail)closeDetail()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&detail.classList.contains('open')){event.stopPropagation();closeDetail()}});document.querySelector('#close-dashboard').addEventListener('click',()=>parent.postMessage({type:'ipo-dashboard-close'},'*'));
  </script>
</body>
</html>
